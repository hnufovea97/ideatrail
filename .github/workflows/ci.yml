name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows는 베타 뒤 (ADR-0017: 첫 베타는 Mac만). Windows를 다시 붙일 때 이 줄에 windows-latest를 되돌린다
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: engine/go.mod }
      - uses: pnpm/action-setup@v4          # 버전은 루트 package.json의 "packageManager"에서
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: cd engine && go test ./... && go test -tags devbuild ./internal/config ./internal/home
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node --test scripts/
      - run: node scripts/measure-tokens.mjs
      - run: scripts/release/assemble.test.sh
