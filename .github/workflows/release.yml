# 릴리스 빌드 (ADR-0021): 빌드 + GitHub 빌드 증명까지만. 서명은 founder가 오프라인에서 release-sign으로.
# 만드는 것은 "초안" 릴리스뿐 — 공개 게시는 founder가 서명 파일을 붙인 뒤 직접.
# 빌드 증명은 공개 저장소에서만 무료 — 저장소 공개(F-3) 전에는 이 워크플로를 돌리지 않는다.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version: { description: "버전 (예: 0.1.0)", required: true }
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    permissions:
      contents: read         # 시험 단계에는 쓰기 권한이 없다
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      RELEASE_PUB: ${{ vars.RELEASE_PUB }}   # 공개키(비밀 아님). 저장소 변수로 founder가 넣는다
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: engine/go.mod }
      - name: 버전 정하기
        id: v
        env: { INPUT_VERSION: "${{ github.event.inputs.version }}" }
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$' || { echo "버전 형식이 틀려요: $v" >&2; exit 1; }
          [ -n "$RELEASE_PUB" ] || { echo "RELEASE_PUB 저장소 변수가 없어요" >&2; exit 1; }
          grep -q "\"version\": \"$v\"" plugin/.claude-plugin/plugin.json || { echo "plugin.json 버전이 $v가 아니에요" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: 엔진 시험
        run: cd engine && go test ./...
  build:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write        # 초안 릴리스 만들기
      id-token: write        # 빌드 증명 서명(Sigstore)
      attestations: write
    env:
      RELEASE_PUB: ${{ vars.RELEASE_PUB }}
      V: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: engine/go.mod }
      - name: 빌드 (Mac universal, 임시 서명)
        run: make build VERSION="$V" RELEASE_PUB="$RELEASE_PUB"
      - name: 릴리스 파일 모으기
        run: |
          mkdir -p out
          cp plugin/engine/darwin/ideatrail out/ideatrail-darwin
          (cd out && shasum -a 256 ideatrail-darwin > SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/ideatrail-darwin
      - name: 초안 릴리스
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "v$V" out/ideatrail-darwin out/SHA256SUMS \
            --draft --target "$GITHUB_SHA" --title "ideatrail $V" \
            --notes "서명 전 초안이에요. founder가 release-sign으로 서명한 .sig를 붙인 뒤 게시해요."
