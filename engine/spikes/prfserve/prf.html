<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>PRF 시험</title>
<button id="go">1. 패스키 만들기</button> <button id="get" disabled>2. PRF 확인</button><pre id="out"></pre>
<script>
const out = (m) => (document.getElementById("out").textContent += m + "\n");
const salt = new TextEncoder().encode("ideatrail-prf-spike-salt-0000000").slice(0, 32);
const hex = (b) => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
let rawId = null;
// Safari는 버튼을 누른 그 순간(사용자 동작) 안에서만 패스키 창을 연다 → 클릭 뒤 다른 await 없이 바로 create/get을 부른다
out("UA: " + navigator.userAgent);
if (PublicKeyCredential.getClientCapabilities) PublicKeyCredential.getClientCapabilities().then(c => out("caps: " + JSON.stringify(c)));
document.getElementById("go").onclick = () => {
  navigator.credentials.create({ publicKey: {
    rp: { name: "PRF spike" }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "spike", displayName: "spike" },
    challenge: crypto.getRandomValues(new Uint8Array(32)), pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { residentKey: "required", userVerification: "required" },
    extensions: { prf: { eval: { first: salt } } } } }).then(c => {
      rawId = c.rawId;
      const ce = c.getClientExtensionResults().prf;
      out("create prf enabled: " + ce?.enabled + " / result at create: " + (ce?.results?.first ? hex(ce.results.first) : "없음"));
      out("→ 이제 [2. PRF 확인]을 누르세요");
      document.getElementById("get").disabled = false;
    }).catch(e => out("만들기 오류: " + e.name + " " + e.message));
};
document.getElementById("get").onclick = () => {
  navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required",
    extensions: { prf: { eval: { first: salt } } } } }).then(a => {
      const ge = a.getClientExtensionResults().prf;
      out("get prf: " + (ge?.results?.first ? hex(ge.results.first) : "없음"));
      out(ge?.results?.first ? "✅ 이 브라우저·기기는 열쇠 풀기 가능" : "❌ 이 조합은 다른 경로 안내 필요");
    }).catch(e => out("확인 오류: " + e.name + " " + e.message));
};
</script>
